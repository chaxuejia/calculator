<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>计算器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="display-content" id="display">0</div>
        </div>
        <div class="buttons">
            <button class="btn btn-clear" id="clear">C</button>
            <button class="btn btn-operator" id="divide">÷</button>
            <button class="btn btn-operator" id="multiply">×</button>
            <button class="btn btn-backspace" id="backspace">⌫</button>
            
            <button class="btn btn-number" id="num7">7</button>
            <button class="btn btn-number" id="num8">8</button>
            <button class="btn btn-number" id="num9">9</button>
            <button class="btn btn-operator" id="subtract">−</button>
            
            <button class="btn btn-number" id="num4">4</button>
            <button class="btn btn-number" id="num5">5</button>
            <button class="btn btn-number" id="num6">6</button>
            <button class="btn btn-operator" id="add">+</button>
            
            <button class="btn btn-number" id="num1">1</button>
            <button class="btn btn-number" id="num2">2</button>
            <button class="btn btn-number" id="num3">3</button>
            <button class="btn btn-equals" id="equals">=</button>
            
            <button class="btn btn-number btn-zero" id="num0">0</button>
            <button class="btn btn-number" id="decimal">.</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
